<section style="border-bottom: 1px solid #1F2836">

</sc-for>

<div style="height: 280px; border-bottom: 1px solid #1F2836; display: flex; align-items: center; justify-content: center; color: #8D99AB; font-family: 'Roboto Mono', monospace; font-size: 12px; text-align: center; padding: 16px">[{{sel.name}} 장비 실사 · 3D 렌더]</div>

<script src="js/morphdom-umd.min.js"></script>
<script src="js/dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { market: 0, product: 0, step: 0 };
}
renderVals() {
var markets = [
{ label: 'Front-End', items: [
{ code: 'FE-01', name: 'NexPion™', tag: 'FRONT-END · HAR ETCH', short: 'R-wave Enhanced Plasma Etcher', desc: '초고종횡비 Trench · Contact · Via Hole을 깊고 곧게 식각하는 플라즈마 에처입니다.', apps: 'GAA · 3D DRAM · HBM', href: '#' },
{ code: 'FE-02', name: 'ALE Series', tag: 'FRONT-END · ATOMIC LAYER ETCH', short: '원자층 식각 플랫폼', desc: 'High Throughput과 Atomic Scale Control을 함께 구현해 차세대 소자의 원자 단위 식각을 지원합니다.', apps: '차세대 Memory · Logic', href: '#' }
]},
{ label: 'Advanced Package', items: [
{ code: 'AP-01', name: 'Cu Ion Milling', tag: 'ADVANCED PACKAGE · CU ETCH', short: '고밀도 플라즈마 Cu 식각', desc: '독자 플라즈마 소스를 기반으로 Cu Seed Layer와 인터포저 배선을 정밀하게 식각합니다.', apps: 'Cu Seed · Si Interposer · OLEDoS', href: 'cu-ion-milling.html' },
{ code: 'AP-02', name: 'BDF Etch', tag: 'ADVANCED PACKAGE · SUBSTRATE', short: '패키지 기판용 식각', desc: '패키지 기판 공정을 위한 식각 솔루션입니다. [BDF 정식 명칭 · 공정 설명]', apps: 'Etch Rate · Uniformity · Throughput', href: '#' }
]},
{ label: 'Display', items: [
{ code: 'DP-01', name: 'ICP Dry Etcher', tag: 'DISPLAY · DRY ETCH', short: 'OLED 양산용 건식각', desc: 'AMOLED · LCD 양산 라인에서 대면적 기판을 균일하게 건식각하는 ICP 장비입니다.', apps: 'AMOLED · LTPS · TFT-LCD', href: '#' },
{ code: 'DP-02', name: 'Plasma Asher', tag: 'DISPLAY · PLASMA TREATMENT', short: '증착 전 플라즈마 처리', desc: '증착 공정 전에 유기물을 제거하고 표면을 처리해 수율을 높이는 플라즈마 애싱 시스템입니다.', apps: 'AMOLED · [적용 공정]', href: '#' }
]}
];
var stepsData = [
{ no: '01', title: 'Process Gas', desc: '목표 막질에 맞춘 공정 가스를 진공 챔버에 정밀한 유량으로 주입합니다.' },
{ no: '02', title: 'RF Power', desc: 'RF 전력을 인가해 가스를 이온화하고 플라즈마를 점화합니다.' },

];
var self = this;
var m = markets[this.state.market];
var pIdx = Math.min(this.state.product, m.items.length - 1);
var tabBase = 'min-height: 48px; padding: 0 22px; border: 0; cursor: pointer; font-size: 14px; font-weight: 500; ';
var tabs = markets.map(function (mk, i) {
return { label: mk.label, style: tabBase + (i === self.state.market ? 'background: #A58BFF; color: #07090F' : 'background: transparent; color: #C9D2DF'), pick: function () { self.setState({ market: i, product: 0 }); } };
});

});
var stepBase = 'display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 0 4px; border: 0; border-bottom: 1px solid #1F2836; background: transparent; cursor: pointer; font-size: 18px; text-align: left; ';

});
if (!this.videoRef) {
this.videoRef = function (el) { if (el) { el.muted = true; el.loop = true; el.playsInline = true; var pr = el.play(); if (pr && pr.catch) { pr.catch(function () {}); } } };
}
return { tabs: tabs, products: products, sel: m.items[pIdx], steps: steps, step: stepsData[this.state.step], videoRef: this.videoRef };
}
}
DCLite.mount(Component, document.getElementById('dc-root'), document.getElementById('dc-tpl'));
</script>
